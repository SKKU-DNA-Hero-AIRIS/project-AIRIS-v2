<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1000" viewBox="0 0 1800 1000" font-family="Malgun Gothic, 'Noto Sans KR', Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#37474f"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1565c0"/>
    </marker>
  </defs>
  <rect width="1800" height="1000" fill="#ffffff"/>

  <!-- 제목 -->
  <text x="900" y="48" text-anchor="middle" font-size="30" font-weight="700" fill="#212121">AIRIS 시스템 구조: 미리 계산해 두고, 게이트 앞에서는 바로 추천한다</text>
  <text x="900" y="78" text-anchor="middle" font-size="16" fill="#616161">체형·사용자 특성 기반 물리 시뮬레이션–AI 융합 사용자 맞춤형 에어게이트 최적화</text>

  <!-- ===== 오프라인 영역 ===== -->
  <rect x="40" y="110" width="1720" height="330" rx="14" fill="#f5f7fa" stroke="#cfd8dc" stroke-width="1.5"/>
  <text x="64" y="144" font-size="21" font-weight="700" fill="#37474f">① 미리 계산 단계 (설치 전에 한 번, 시간 제약 없음)</text>

  <!-- 상자: 체형·시나리오 -->
  <g>
    <rect x="64" y="175" width="250" height="150" rx="10" fill="#ffffff" stroke="#607d8b" stroke-width="2"/>
    <text x="189" y="203" text-anchor="middle" font-size="17" font-weight="700" fill="#263238">다양한 체형과 사용자 유형</text>
    <text x="189" y="230" text-anchor="middle" font-size="13.5" fill="#455a64">체형 5가지 값: 키 · 어깨 너비</text>
    <text x="189" y="250" text-anchor="middle" font-size="13.5" fill="#455a64">몸통 두께 · 팔 길이 · 다리 길이</text>
    <text x="189" y="270" text-anchor="middle" font-size="13.5" fill="#455a64">사용자 유형: 일반 · 임산부 · 휠체어</text>
    <text x="189" y="296" text-anchor="middle" font-size="13" fill="#78909c">(유형마다 움직일 수 있는 범위가 다름)</text>
    <text x="189" y="318" text-anchor="middle" font-size="12" fill="#90a4ae">체형 100개 × 유형 3개</text>
  </g>

  <!-- 상자: 가상 인체 -->
  <g>
    <rect x="364" y="175" width="250" height="150" rx="10" fill="#ffffff" stroke="#607d8b" stroke-width="2"/>
    <text x="489" y="203" text-anchor="middle" font-size="17" font-weight="700" fill="#263238">가상 인체 만들기</text>
    <text x="489" y="230" text-anchor="middle" font-size="13.5" fill="#455a64">3D 사람 모델(MakeHuman)을</text>
    <text x="489" y="250" text-anchor="middle" font-size="13.5" fill="#455a64">체형 값에 맞게 변형하고 자세를 잡음</text>
    <text x="489" y="270" text-anchor="middle" font-size="13.5" fill="#455a64">몸 표면을 작은 조각으로 나눠 계산</text>
    <text x="489" y="296" text-anchor="middle" font-size="13" fill="#78909c">휠체어 프레임 · 부스 벽도 함께 모델링</text>
    <text x="489" y="318" text-anchor="middle" font-size="12" fill="#90a4ae">(표면 조각 약 2,600개)</text>
  </g>

  <!-- 상자: 물리 평가 -->
  <g>
    <rect x="664" y="160" width="400" height="180" rx="10" fill="#fff8e1" stroke="#f9a825" stroke-width="2.5"/>
    <text x="864" y="190" text-anchor="middle" font-size="17" font-weight="700" fill="#4e342e">물리 시뮬레이션으로 점수 매기기</text>
    <text x="864" y="217" text-anchor="middle" font-size="13.5" fill="#5d4037">바람이 몸 어디에 얼마나 세게 닿는지 계산</text>
    <text x="864" y="237" text-anchor="middle" font-size="13.5" fill="#5d4037">(바람 흐름 모델 + 팔·몸이 가리는 부분 판정)</text>
    <text x="864" y="257" text-anchor="middle" font-size="13.5" fill="#5d4037">점수 = 먼지 제거 효과 − 자세의 불편함 (− 에너지·시간)</text>
    <text x="754" y="290" text-anchor="middle" font-size="13.5" font-weight="700" fill="#6d4c41">빠른 계산 방식</text>
    <text x="754" y="309" text-anchor="middle" font-size="12.5" fill="#8d6e63">1회 0.04초 · 최적화와 실시간에 사용</text>
    <text x="974" y="290" text-anchor="middle" font-size="13.5" font-weight="700" fill="#6d4c41">정밀 입자 시뮬레이션</text>
    <text x="974" y="309" text-anchor="middle" font-size="12.5" fill="#8d6e63">먼지 알갱이 2만 개를 추적 · 검증용</text>
    <line x1="864" y1="275" x2="864" y2="320" stroke="#ffe082" stroke-width="1.5"/>
    <text x="864" y="333" text-anchor="middle" font-size="11.5" fill="#a1887f">두 방식의 결과 순위가 97~99% 일치하는 것을 확인함</text>
  </g>

  <!-- 상자: 최적화 -->
  <g>
    <rect x="1114" y="175" width="250" height="150" rx="10" fill="#ffffff" stroke="#607d8b" stroke-width="2"/>
    <text x="1239" y="203" text-anchor="middle" font-size="17" font-weight="700" fill="#263238">가장 좋은 자세 찾기 (최적화)</text>
    <text x="1239" y="230" text-anchor="middle" font-size="13.5" fill="#455a64">체형·유형마다 자세 7가지 각도를</text>
    <text x="1239" y="250" text-anchor="middle" font-size="13.5" fill="#455a64">조금씩 바꿔 가며 점수가 높은 쪽으로</text>
    <text x="1239" y="270" text-anchor="middle" font-size="13.5" fill="#455a64">탐색 (2,000회 평가, 진화 전략 CMA-ES)</text>
    <text x="1239" y="296" text-anchor="middle" font-size="13" fill="#78909c">부스 벽에 닿는 자세는 제외</text>
    <text x="1239" y="318" text-anchor="middle" font-size="12" fill="#90a4ae">상위 후보 16개까지 저장</text>
  </g>

  <!-- 상자: 데이터셋 → 학습 -->
  <g>
    <rect x="1414" y="160" width="320" height="180" rx="10" fill="#e3f2fd" stroke="#1565c0" stroke-width="2.5"/>
    <text x="1574" y="190" text-anchor="middle" font-size="17" font-weight="700" fill="#0d47a1">결과를 모아 AI 추천 모델 학습</text>
    <text x="1574" y="217" text-anchor="middle" font-size="13.5" fill="#1a237e">체형 100개 × 유형 3개 = 300건의</text>
    <text x="1574" y="237" text-anchor="middle" font-size="13.5" fill="#1a237e">"이 체형엔 이 자세가 좋다" 데이터</text>
    <text x="1574" y="266" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0d47a1">생성형 AI 모델 (flow matching)</text>
    <text x="1574" y="286" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0d47a1">+ 비슷한 체형 참조표</text>
    <text x="1574" y="311" text-anchor="middle" font-size="12.5" fill="#5472d3">어떤 물리 설정으로 학습했는지 함께 기록</text>
    <text x="1574" y="331" text-anchor="middle" font-size="12" fill="#90a4ae">(설정이 바뀌면 다시 학습)</text>
  </g>

  <!-- 화살표 (오프라인) -->
  <line x1="314" y1="250" x2="360" y2="250" stroke="#37474f" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="614" y1="250" x2="660" y2="250" stroke="#37474f" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="1064" y1="235" x2="1110" y2="235" stroke="#37474f" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="1110" y1="270" x2="1068" y2="270" stroke="#37474f" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="1087" y="224" text-anchor="middle" font-size="11" fill="#546e7a">점수</text>
  <text x="1087" y="289" text-anchor="middle" font-size="10.5" fill="#546e7a">후보</text>
  <line x1="1364" y1="250" x2="1410" y2="250" stroke="#37474f" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- 검증 띠 -->
  <rect x="64" y="368" width="1670" height="52" rx="8" fill="#eceff1" stroke="#b0bec5" stroke-width="1"/>
  <text x="84" y="389" font-size="13.5" font-weight="700" fill="#37474f">검증 실험</text>
  <text x="84" y="409" font-size="12.5" fill="#455a64">상식 검증(팔을 들면 겨드랑이 제거율이 오르는가) · 두 계산 방식 비교 · 물리 상수를 바꿔도 결론이 유지되는가 · 제안 자세 vs 기존 안내 자세 비교 · AI 추천 품질(처음 보는 체형) · 운전 계획(자세 순서·바람 세기·시간) 비교</text>

  <!-- ===== 산출물 전달 화살표 ===== -->
  <path d="M 1574 340 L 1574 352 L 1760 352 L 1760 470 L 1150 470 L 1150 540" fill="none" stroke="#1565c0" stroke-width="3" stroke-dasharray="9 6" marker-end="url(#arrowBlue)"/>
  <text x="1465" y="464" text-anchor="middle" font-size="13" font-weight="700" fill="#1565c0">학습된 AI 모델 + 참조표를 게이트 장비에 설치</text>

  <!-- ===== 실시간 영역 ===== -->
  <rect x="40" y="540" width="1720" height="330" rx="14" fill="#f1f8f4" stroke="#a5d6a7" stroke-width="1.5"/>
  <text x="64" y="574" font-size="21" font-weight="700" fill="#1b5e20">② 게이트 앞 추천 단계 (사람마다 실시간, 평균 1.5초 안에 응답)</text>

  <!-- 입력 -->
  <g>
    <rect x="64" y="605" width="300" height="200" rx="10" fill="#ffffff" stroke="#43a047" stroke-width="2"/>
    <text x="214" y="633" text-anchor="middle" font-size="17" font-weight="700" fill="#1b5e20">체형 측정 · 사용자 유형 선택</text>
    <text x="214" y="660" text-anchor="middle" font-size="13.5" fill="#2e7d32">카메라 1대 → 관절 위치 인식(YOLO) → 체형 5가지</text>
    <text x="214" y="680" text-anchor="middle" font-size="13.5" fill="#2e7d32">화면에는 뼈대 선만 표시, 영상은 저장하지 않음</text>
    <text x="214" y="700" text-anchor="middle" font-size="13.5" fill="#2e7d32">사진 · 영상 파일 · 직접 입력도 가능</text>
    <text x="214" y="727" text-anchor="middle" font-size="13.5" fill="#2e7d32">사용자 유형은 본인이 직접 선택</text>
    <text x="214" y="747" text-anchor="middle" font-size="13" fill="#66bb6a">(임신·장애 여부를 영상으로 판별하지 않음)</text>
    <text x="214" y="772" text-anchor="middle" font-size="12.5" fill="#9e9e9e">향후 검토: 레이더(mmWave) 센서로 키 측정</text>
    <text x="214" y="796" text-anchor="middle" font-size="12" fill="#90a4ae">(아직 구현 안 됨)</text>
  </g>

  <!-- 후보 생성 -->
  <g>
    <rect x="414" y="605" width="330" height="200" rx="10" fill="#e3f2fd" stroke="#1565c0" stroke-width="2.5"/>
    <text x="579" y="633" text-anchor="middle" font-size="17" font-weight="700" fill="#0d47a1">AI가 자세 후보를 여러 개 제안</text>
    <text x="579" y="662" text-anchor="middle" font-size="14" fill="#1a237e">생성형 AI 모델이 만든 자세  <tspan font-weight="700">8개</tspan></text>
    <text x="579" y="684" text-anchor="middle" font-size="14" fill="#1a237e">비슷한 체형에서 좋았던 자세  <tspan font-weight="700">8개</tspan></text>
    <text x="579" y="706" text-anchor="middle" font-size="14" fill="#1a237e">항상 넣는 기본 후보(만세 · 팔 내림)  <tspan font-weight="700">2개</tspan></text>
    <line x1="454" y1="720" x2="704" y2="720" stroke="#90caf9" stroke-width="1.5"/>
    <text x="579" y="742" text-anchor="middle" font-size="13.5" fill="#1a237e">= 후보 18개, 사용자 유형의 가동 범위로 맞춤</text>
    <text x="579" y="768" text-anchor="middle" font-size="12.5" fill="#5472d3">AI 모델이 없어도 기본 후보만으로 동작</text>
    <text x="579" y="796" text-anchor="middle" font-size="12" fill="#90a4ae">(AI 출력을 그대로 믿지 않는 구조)</text>
  </g>

  <!-- 재채점 -->
  <g>
    <rect x="794" y="605" width="330" height="200" rx="10" fill="#fff8e1" stroke="#f9a825" stroke-width="2.5"/>
    <text x="959" y="633" text-anchor="middle" font-size="17" font-weight="700" fill="#4e342e">물리 시뮬레이션으로 다시 확인 · 선택</text>
    <text x="959" y="662" text-anchor="middle" font-size="13.5" fill="#5d4037">①과 같은 빠른 계산 방식으로 후보 18개 점수 매김</text>
    <text x="959" y="684" text-anchor="middle" font-size="13.5" fill="#5d4037">(이 사람 체형의 가상 인체로, 같은 물리 설정)</text>
    <text x="959" y="710" text-anchor="middle" font-size="13.5" fill="#5d4037">부스 벽에 닿거나 불가능한 자세는 제외</text>
    <text x="959" y="732" text-anchor="middle" font-size="13.5" fill="#5d4037">가능한 후보 중 점수가 가장 높은 자세 선택</text>
    <text x="959" y="762" text-anchor="middle" font-size="12.5" fill="#8d6e63">후보 18개 재계산에 약 1초</text>
    <text x="959" y="796" text-anchor="middle" font-size="12" fill="#90a4ae">(처음 보는 체형에도 품질이 보장되는 이유)</text>
  </g>

  <!-- 안내 -->
  <g>
    <rect x="1174" y="605" width="560" height="200" rx="10" fill="#ffffff" stroke="#43a047" stroke-width="2"/>
    <text x="1454" y="633" text-anchor="middle" font-size="17" font-weight="700" fill="#1b5e20">화면 안내</text>
    <text x="1454" y="662" text-anchor="middle" font-size="13.5" fill="#2e7d32">추천 자세를 3D 사람 모델과 문장으로 안내 · 기존 안내 자세와 점수 비교</text>
    <text x="1454" y="684" text-anchor="middle" font-size="13.5" fill="#2e7d32">후보가 어디서 왔는지(AI / 참조표 / 기본) · 응답 시간 · 설정 일치 여부 표시</text>
    <text x="1454" y="706" text-anchor="middle" font-size="13.5" fill="#2e7d32">먼지 입자 움직임 애니메이션 (실제 계산 결과)</text>
    <line x1="1214" y1="722" x2="1694" y2="722" stroke="#c8e6c9" stroke-width="1.5"/>
    <text x="1454" y="746" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1b5e20">확장: 운전 계획 안내</text>
    <text x="1454" y="768" text-anchor="middle" font-size="13" fill="#388e3c">추천 자세 그대로 몇 번 돌아설지 · 벽별 바람 세기 · 총 분사 시간</text>
    <text x="1454" y="796" text-anchor="middle" font-size="12" fill="#90a4ae">(설계 중)</text>
  </g>

  <!-- 화살표 (실시간) -->
  <line x1="364" y1="705" x2="410" y2="705" stroke="#37474f" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="744" y1="705" x2="790" y2="705" stroke="#37474f" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="1124" y1="705" x2="1170" y2="705" stroke="#37474f" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- 공통 설정 -->
  <rect x="64" y="830" width="1670" height="30" rx="6" fill="#ffffff" stroke="#cfd8dc" stroke-width="1"/>
  <text x="899" y="851" text-anchor="middle" font-size="13" fill="#455a64">①과 ②는 같은 물리 설정과 같은 가상 인체를 쓴다. 설정이 달라지면 화면에 "불일치" 경고가 뜨고 모델을 다시 학습한다.</text>

  <!-- 하단 주석 -->
  <text x="64" y="905" font-size="13.5" font-weight="700" fill="#37474f">범위와 한계</text>
  <text x="64" y="928" font-size="12.5" fill="#546e7a">· 점수는 시뮬레이션 안의 상대 비교값이며 실제 먼지 제거율(%)이 아니다. 물리 상수는 논문 값에 근거하며 실제 장비로 보정하지 않았다.  · 장비 제어(벽별 바람 세기·시간) 연동은 범위 밖이다.</text>
  <text x="64" y="950" font-size="12.5" fill="#546e7a">· 노즐을 기계적으로 움직이는 것은 다루지 않는다.  · 운전 계획 실험 결과: 자세를 바꿔 가는 것보다 "가장 좋은 자세 하나로 돌아서는 것"이 모든 사용자 유형에서 나았다 → 제품 동작은 최적 자세 추천 + 회전 안내가 유력.</text>
  <text x="1736" y="985" text-anchor="end" font-size="11" fill="#9e9e9e">AIRIS v2 · 2026-10-04</text>
</svg>
