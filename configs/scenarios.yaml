# 시나리오별 자세 제약과 페널티. 소유자: B.
# nozzle_height_range_m, nozzle_strength_cap 은 README 12절 노즐 확장용. 현재는 읽기만 하고 쓰지 않는다.
# pose 변수 단위: degree. 범위 밖은 최적화 대상에서 제외.

default:
  pose_bounds:
    shoulder_abduction: [0, 180]   # 150 → 180 (총괄: E4 기준 자세 B1 을 만세로). 휠체어·임산부는 상속
    shoulder_flexion: [-30, 150]
    elbow_flexion: [0, 140]
    torso_pitch: [-20, 45]
    torso_yaw: [-180, 180]
    hip_flexion: [0, 30]
    knee_flexion: [0, 30]   # 선 자세 무릎 굽힘. PoseParams 7개와 맞춤 (C 요청)
  discomfort_weights:
    shoulder_abduction: 0.3
    torso_pitch: 0.5
  fixed_pose: {}
  nozzle_height_range_m: [0.3, 2.0]

pregnant:
  inherits: default
  pose_bounds:
    torso_pitch: [-10, 15]
  discomfort_weights:
    torso_pitch: 2.0
    shoulder_abduction: 0.6
  nozzle_strength_cap:
    torso_front: 0.6

wheelchair:
  inherits: default
  fixed_pose:
    hip_flexion: 90
    knee_flexion: 90
  pose_bounds:
    torso_pitch: [-10, 20]
    torso_yaw: [-45, 45]
  seat_height_m: 0.5
  nozzle_height_range_m: [0.2, 1.5]
