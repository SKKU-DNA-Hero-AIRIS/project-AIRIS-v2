# 시나리오별 자세 제약과 페널티. 소유자: B.
# nozzle_height_range_m 은 README 12절 노즐 확장용. 현재는 읽기만 하고 쓰지 않는다.
# nozzle_strength_cap 은 구역 세기 쾌적 상한 {구역 이름: 상한} (00_common.md 4.7, ZONE_NAMES, 계획 평가 전용).
#   scenario.zone_strength_caps 가 읽는다. 구역 이름이 아닌 키(옛 부위 키 torso_front 등)는 로드 오류다.
# pose 변수 단위: degree. 범위 밖은 최적화 대상에서 제외.

default:
  pose_bounds:
    shoulder_abduction: [0, 180]   # 150 → 180 (총괄: E4 기준 자세 B1 을 만세로). 휠체어·임산부는 상속
    shoulder_flexion: [-30, 150]
    elbow_flexion: [0, 140]
    torso_pitch: [-20, 45]
    torso_yaw: [-180, 180]
    hip_flexion: [0, 30]
    knee_flexion: [0, 30]   # 선 자세 무릎 굽힘. PoseParams 7개와 맞춤 (C 요청)
  discomfort_weights:
    shoulder_abduction: 0.3
    torso_pitch: 0.5
  fixed_pose: {}
  nozzle_height_range_m: [0.3, 2.0]

pregnant:
  inherits: default
  pose_bounds:
    torso_pitch: [-10, 15]
  discomfort_weights:
    torso_pitch: 2.0
    shoulder_abduction: 0.6
  nozzle_strength_cap:
    # 가슴 쪽 벽 구역 (몸 기준, torso_yaw 와 무관) 세기 ≤ 0.6. 배를 향한 측면 바 4개.
    chest_low: 0.6
    chest_high: 0.6
  # 메시 몸(body.model: mesh)에 적용할 MakeHuman 모디파이어 타깃 {파일 이름: 가중치}. 파일은 data/meshes/makehuman/.
  # 파일이 없으면 적용하지 않는다 (stomach-pregnant-incr.target 은 CC0, 사용자 승인 후 커밋됨 — PR #53).
  mesh_targets:
    stomach-pregnant-incr: 1.0

wheelchair:
  inherits: default
  fixed_pose:
    hip_flexion: 90
    knee_flexion: 90
  pose_bounds:
    torso_pitch: [-10, 20]
    torso_yaw: [-45, 45]
  seat_height_m: 0.5
  nozzle_height_range_m: [0.2, 1.5]
