# 고정 노즐 배치. 소유자: B. 최적화 대상이 아니다 (README 12절 확장 채택 시에만 변수가 됨).
# 업계 표준을 따른 초안: 양쪽 벽면 4단, 측면 노즐은 진행 방향으로 25도 경사.
# 좌표계: x=진행 방향, y=좌우 (부스 중심 0), z=상하 (바닥 0). 단위 m, 각도 degree.

booth:
  length_m: 2.0          # x
  width_m: 1.2           # y (벽면 y = ±0.6)
  height_m: 2.3          # z
  exhaust: floor         # LBM 검증용 배기 위치

layout:
  wall_y: [-0.6, 0.6]
  # 벽면당 x 방향 2열. 마네킹은 부스 중앙 x = length_m/2 = 1.0 에 선다 (00_common.md 5절).
  # yaw 25도 제트가 몸 중심선(y=0)을 지나는 x 는 x_n + |wall_y|·tan(25°) = x_n + 0.28 이므로,
  # 중심을 맞히는 열은 x_n = 1.0 - 0.28 = 0.72. 두 열을 여기서 ±0.10 에 둔다.
  # (초안 [0.7, 1.3] 은 뒤 열이 x ≈ 1.58 에서 교차해 마네킹을 완전히 빗나갔다. B 단계 7 에서 발견.)
  x_positions: [0.62, 0.82]
  z_levels: [0.5, 0.9, 1.3, 1.7]    # 4단
  yaw_deg: 25                       # 안쪽 법선에서 진행 방향(+x)으로 회전. 업계 자료의 20~30도 경사
  pitch_deg: 0                      # 상하 각도 (양수 = 아래로)
  strength: 1.0                     # exit_velocity 배수

# 위 layout을 전개하면 노즐 2벽 × 2열 × 4단 = 16개.
# scenario.load_nozzles()가 전개하여 NozzleConfig를 만든다.
