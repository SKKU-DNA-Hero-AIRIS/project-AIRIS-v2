# 고정 토출구 배치. 소유자: B. 최적화 대상이 아니다 (README 12절 확장 채택 시에만 변수가 됨).
# 기준 장비: 퓨리움 PURIUM-10000-P (공개 사양 1940(W)×2400(H)×886(D) mm, 크로스팬 12개, 측면 슬롯 바 4단 + 상단 에어커튼).
# 아래 부스 내부 치수와 바 위치·길이는 전부 제품 이미지에서 추정한 값이다. 키마다 "추정, 퓨리움 확인 대기".
# 좌표계: x=진행 방향, y=좌우 (부스 중심 0), z=상하 (바닥 0). 단위 m, 각도 degree.

booth:
  length_m: 0.886        # x. 외형 깊이 886 mm (공개 사양). 내부 통로 길이로 그대로 쓴다. 추정, 퓨리움 확인 대기
  width_m: 0.90          # y (벽면 y = ±0.45). 통로 폭. 추정, 퓨리움 확인 대기
  height_m: 2.0          # z. 통로 높이 (상단 에어커튼 바 높이). 추정, 퓨리움 확인 대기
  exhaust: side_bottom   # LBM 검증용 배기 위치. 측면 하단 흡입. 추정, 퓨리움 확인 대기

# load_nozzles() 가 전개할 배치. slot_bars (기준 장비) | layout (원형 노즐 비교 배치)
active: slot_bars

# --- 기준 장비: 슬롯 바 (00_common.md 4.1b) -------------------------------------------
# 전개 결과 NozzleConfig: 측면 2벽 × 4단 = 8개 + 상단 2개 = 10개. 전 행이 슬롯 (slot_axis, slot_length 채움).
# 크로스팬 12개 = 측면 바 8개 × 1 + 상단 바 2개 × 2.
slot_bars:
  side:
    wall_y: [-0.45, 0.45]            # 좌우 벽면 = booth.width_m / 2. 추정, 퓨리움 확인 대기
    x_center: 0.443                  # 바 중심 x = booth.length_m / 2 (마네킹 위치). 추정, 퓨리움 확인 대기
    length_m: 0.60                   # 바(슬롯) 길이, x 방향. 추정, 퓨리움 확인 대기
    z_levels: [0.60, 0.85, 1.10, 1.35]   # 4단 높이. 추정, 퓨리움 확인 대기
    yaw_deg: 0                       # 안쪽 법선에서 진행 방향(+x)으로 회전. 경사는 퓨리움 확인 대기
    pitch_deg: 0                     # 아래로 기울임 (양수 = 아래). 추정, 퓨리움 확인 대기
    strength: 1.0                    # jet.slot.exit_velocity_mps 배수 (팬 1개). 추정, 퓨리움 확인 대기
  top:
    x_positions: [0.10, 0.79]        # 입구·출구 쪽 에어커튼 바 x. 추정, 퓨리움 확인 대기
    y_center: 0.0                    # 바 중심 y. 추정, 퓨리움 확인 대기
    z: 2.0                           # 바 높이 = booth.height_m. 추정, 퓨리움 확인 대기
    length_m: 0.60                   # 바(슬롯) 길이, y 방향. 추정, 퓨리움 확인 대기
    tilt_deg: 0                      # 수직 아래에서 진행 방향(+x)으로 기울임. 추정, 퓨리움 확인 대기
    strength: 2.0                    # 팬 2개 병렬. 추정, 퓨리움 확인 대기

# --- 원형 노즐 비교 배치 (00_common.md 4.1) --------------------------------------------
# 이전 기준 배치(양쪽 벽면 4단, 25도 경사)를 새 부스 폭에 맞춘 것. load_nozzles(layout="layout") 로 전개하면
# slot_axis = None (전부 원형)인 16개. tests/fakes.fake_nozzles 가 wall_y, yaw_deg, pitch_deg, strength 를 읽는다.
layout:
  wall_y: [-0.45, 0.45]
  # yaw 25도 제트가 몸 중심선(y=0)을 지나는 x 는 x_n + |wall_y|·tan(25°) = x_n + 0.21 이므로,
  # 중심(x = length_m/2 = 0.443)을 맞히는 열은 x_n = 0.233. 두 열을 여기서 ±0.10 에 둔다.
  x_positions: [0.13, 0.33]
  z_levels: [0.5, 0.9, 1.3, 1.7]    # 4단
  yaw_deg: 25                       # 안쪽 법선에서 진행 방향(+x)으로 회전. 업계 자료의 20~30도 경사
  pitch_deg: 0                      # 상하 각도 (양수 = 아래로)
  strength: 1.0                     # jet.exit_velocity_mps 배수
