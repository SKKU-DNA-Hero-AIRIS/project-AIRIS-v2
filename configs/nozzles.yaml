# 고정 토출구 배치. 소유자: B. 최적화 대상이 아니다 (README 12절 확장 채택 시에만 변수가 됨).
# 기준 장비: 퓨리움 PURIUM-10000-P (공개 사양 1940(W)×2400(H)×886(D) mm, 크로스팬 12개, 측면 슬롯 바 4단 + 상단 에어커튼).
# 부스 내부 치수와 바 위치는 제조사 브로슈어 정면 설치 실사진 2장(p12, p15)과 제안서 p7 선도에서 외형 1940 mm 를
# 기준으로 잰 값이다. 슬롯 길이·높이는 이미지 추정이다. 키마다 "퓨리움 확인 대기".
# 좌표계: x=진행 방향, y=좌우 (부스 중심 0), z=상하 (바닥 0). 단위 m, 각도 degree.

booth:
  length_m: 0.886        # x. 외형 깊이 886 mm (공개 사양). 내부 통로 길이로 그대로 쓴다. 퓨리움 확인 대기
  # y (벽면 y = ±0.73). 통로 폭. 브로슈어 정면 실사진 2장 1463~1470 mm, 제안서 선도 1478 mm
  # (기둥 앞면 231~240 mm × 2). 이전 0.90 은 제품 렌더 원근 착오. 퓨리움 확인 대기
  width_m: 1.46
  height_m: 2.15         # z. 통로 높이. 외형 2400 − 상부 보 ≈ 234 mm (브로슈어 정면 실사진). 퓨리움 확인 대기
  exhaust: side_bottom   # LBM 검증용 배기 위치. 측면 하단 흡입. 퓨리움 확인 대기

# load_nozzles() 가 전개할 배치. slot_bars (기준 장비) | layout (원형 노즐 비교 배치)
active: slot_bars

# --- 기준 장비: 슬롯 바 (00_common.md 4.1b) -------------------------------------------
# 전개 결과 NozzleConfig: 측면 2벽 × 4단 = 8개 + 상단 2 × 2 = 4개 = 12개. 전 행이 슬롯 (slot_axis, slot_length 채움).
# 크로스팬 12개 = 바 12개 × 팬 1개 (제안서 선도의 아래 방향 화살표 4개).
slot_bars:
  side:
    wall_y: [-0.73, 0.73]            # 좌우 벽면 = booth.width_m / 2. 퓨리움 확인 대기
    x_center: 0.443                  # 바 중심 x = booth.length_m / 2 (마네킹 위치). 퓨리움 확인 대기
    length_m: 0.60                   # 바(슬롯) 길이, x 방향. 이미지 추정, 퓨리움 확인 대기
    z_levels: [0.72, 0.95, 1.18, 1.42]   # 4단 높이. 브로슈어 정면 실사진 (±0.05 m). 퓨리움 확인 대기
    yaw_deg: 0                       # 안쪽 법선에서 진행 방향(+x)으로 회전. 경사는 퓨리움 확인 대기
    pitch_deg: 0                     # 아래로 기울임 (양수 = 아래). 퓨리움 확인 대기
    strength: 1.0                    # jet.slot.exit_velocity_mps 배수 (팬 1개). 퓨리움 확인 대기
  top:
    # 상단 바 = x_positions × y_positions. 제안서 선도의 아래 방향 화살표 4개.
    x_positions: [0.10, 0.79]        # 입구·출구 쪽 에어커튼 바 x. 이미지 추정, 퓨리움 확인 대기
    y_positions: [-0.33, 0.33]       # 바 중심 y. 제안서 선도, 퓨리움 확인 대기
    z: 2.15                          # 바 높이 = booth.height_m. 퓨리움 확인 대기
    length_m: 0.60                   # 바(슬롯) 길이, y 방향. 이미지 추정, 퓨리움 확인 대기
    tilt_deg: 0                      # 수직 아래에서 진행 방향(+x)으로 기울임. 퓨리움 확인 대기
    strength: 1.0                    # 팬 1개. 퓨리움 확인 대기

# --- 원형 노즐 비교 배치 (00_common.md 4.1) --------------------------------------------
# 이전 기준 배치(양쪽 벽면 4단, 25도 경사)를 부스 폭에 맞춘 것. load_nozzles(layout="layout") 로 전개하면
# slot_axis = None (전부 원형)인 16개. tests/fakes.fake_nozzles 가 wall_y, yaw_deg, pitch_deg, strength 를 읽는다.
layout:
  wall_y: [-0.73, 0.73]
  # yaw 25도 제트가 몸 중심선(y=0)을 지나는 x 는 x_n + |wall_y|·tan(25°) = x_n + 0.34 이므로,
  # 중심(x = length_m/2 = 0.443)을 맞히는 열은 x_n = 0.103. 부스 입구(x = 0) 안에 두려고 열 간격을
  # 이전 ±0.10 에서 ±0.05 로 줄였다 (yaw 25 유지). 두 제트 축은 중심선에서 x ±0.05 에서 교차한다.
  x_positions: [0.05, 0.15]
  z_levels: [0.5, 0.9, 1.3, 1.7]    # 4단
  yaw_deg: 25                       # 안쪽 법선에서 진행 방향(+x)으로 회전. 업계 자료의 20~30도 경사
  pitch_deg: 0                      # 상하 각도 (양수 = 아래로)
  strength: 1.0                     # jet.exit_velocity_mps 배수
