# 물리 상수 단일 소스. 소유자: B (물리 모델). 변경은 PR로만.
# 민감도 실험은 이 파일의 값을 기준으로 스윕한다.

jet:
  # 0.004 → 0.025 (B, PR #6). 4 mm 는 노즐 16개 총 유량이 18 m^3/h 로 에어샤워 규모와 두 자릿수 이상 어긋나고,
  # 몸 표면 전단이 모든 자세에서 제거율 0 을 만들었다. 25 mm 면 707 m^3/h. 에어샤워 볼 노즐 20~30 mm.
  nozzle_diameter_m: 0.025
  exit_velocity_mps: 25.0         # 에어샤워 표준 풍속
  # 포텐셜 코어 길이 L_c = decay_constant × nozzle_diameter_m (00_common.md 4.1). 별도 키를 두지 않는다.
  decay_constant: 6.7             # 중심 속도 감쇠 상수 (자유 제트 실험식)
  halfwidth_spread_rate: 0.096    # 반속도 반경 확산율 r_1/2 = 0.5D + 0.096 s (원형 난류 제트 실험값)
  slot:
    # 슬롯(평면) 제트, 00_common.md 4.1b. 기준 장비 퓨리움 PURIUM-10000-P 의 크로스팬 토출구.
    # NozzleConfig.slot_axis 가 있는 노즐만 이 키를 쓴다. 위 원형 노즐 키는 원형 배치 비교용으로 남긴다.
    height_m: 0.022                 # 슬롯 높이 h. 이미지 추정, 퓨리움 확인 대기
    # 출구 속도 = 크로스팬 1개 풍량 ÷ 슬롯 면적: 9.2/60 ÷ (0.60 m × 0.022 m) = 11.6 m/s. 바 1개 = 팬 1개 (측면·상단 모두 strength 1).
    # 9.2 m^3/min 은 팬 1개 값이다: 사양 "크로스팬 단품 9.2 m^3/min × 12개" = 110.4 ≈ "전체 송풍량 110 m^3/min".
    # 슬롯 치수(0.60 × 0.022)만 이미지 추정이다. 퓨리움 확인 대기.
    exit_velocity_mps: 11.6
    decay_constant: 5.8             # K_p. Rajaratnam 평면 제트 U_m/U0 = 2.4·sqrt(h/s) → K_p = 2.4² ≈ 5.8
    spread_rate: 0.10               # 평면 제트 반속도 반폭 확산율 (실험값 ≈ 0.10)
  impingement:
    # 충돌 제트 → 벽면 제트 보정, 00_common.md 4.2b (B 단계 8, 총괄 ⑩ 으로 필수 격상).
    # velocity_field(_per_nozzle) 에 surface_normals 를 넘길 때만 적용된다.
    enabled: true
    # 벽면 제트 진폭 k. 1.0 → 1.4 (2026-09-30 총괄 결정). 기준 장비가 슬롯 12개라 아래 문헌 재추정의 슬롯 값을 쓴다.
    # 미보정, E3 스윕 변수 (1.0·1.4·1.6·2.0 권장). 1.0 은 자유 제트 중심 속도를 그대로 쓰는 중립값이었다.
    # 문헌 재추정 (2026-09-30). [원문] = PDF 원문에서 직접 확인, [2차] = 인용문으로만 확인.
    #   - [원문] Phares, Smedley & Flagan 2000 (J. Fluid Mech. 418:351) 그림 3a: 완전 발달 평면 충돌 제트(H/D > 6)의
    #     경계층 밖 표면 속도 U/u_s 는 0 에서 단조 증가해 1 로 수렴하고 넘지 않는다 (u_s = 충돌 높이의 자유 제트 중심
    #     속도 = 우리 U_c(H)). Beltaos & Rajaratnam 측정점 포함. 눈대중 값 x/b_u 0.5·1·1.5·2·3 → 0.30·0.57·0.72·0.85·0.95.
    #   - 4.2b 형상 함수(ξ = r/σ, b_u = 1.177σ) 최댓값: 원형 (1−e^{−ξ²/2})/ξ = 0.451 (ξ 1.585), 슬롯 /√ξ = 0.614 (ξ 2.16).
    #     U/u_s ≤ 1 이므로 k ≤ 1/0.614 = 1.63 (슬롯), 1/0.451 = 2.22 (원형). k < 1 (예: 0.5) 은 문헌 근거가 없다.
    #   - 슬롯 모델 k 1.4 의 x/b_u 0.5·1·1.5·2·3 값은 0.29·0.65·0.83·0.86·0.74 로 그림 3a 와 x/b_u ≤ 2 에서 ±0.11 안
    #     (k 1.0 은 0.21·0.46·0.59·0.61·0.53 으로 전 구간 낮다). x/b_u 3 이후는 모델이 1/√ξ 로 먼저 줄어 낮다.
    #   - [원문] 원형 방사 벽면 제트 v_m = 1.1·U_o·d_o / r (Pease et al., OSTI 2587227 식 24·28, Beltaos 인용)
    #     → Phares 원형 중심 속도 U_c(H) ≈ 6.2·U_o·D/H 로 나누면 v_m/U_c ≈ 0.18·H/r. 원형 권장 k 1.6~2.0.
    #   - 권장 스윕 (기준 장비는 전부 슬롯): 1.0·1.4·1.6 (+ 2.0 상한 확인).
    #   - 벽 전단 교차 확인: [원문] Phares 식 2.32 평면 τ_m = 7.30·ρ·u_o²·Re_o^−½·(H/D)^−5/4 (x_m = 0.12H, 충돌 영역 층류
    #     경계층), [2차] Tu & Wood 1996 τ_max = 0.067·P_d·h/Z (arXiv 2004.13400 5절). 우리 슬롯(11.6 m/s, h 22 mm,
    #     Re_o 1.7e4, Z 0.4~0.7 m)에서 각각 0.12~0.24 Pa, 0.17~0.30 Pa. 현 모델 최대 전단(Cf 0.005)은 k 1.0 에서
    #     0.03~0.05 Pa (약 5배 작음), k 1.4 에서 0.05~0.10 Pa (약 2.3배 작음). Tu & Wood 정체압 6.5·P_d·h/Z 는 4.1b 중심
    #     속도와 6% 안 → 남는 차이는 충돌 영역 Cf (층류 경계층이 얇아 벽면 제트 구간 0.004~0.009 보다 크다) 쪽이다.
    #     절대 전단 규모는 fabric_roughness_factor 보정이 흡수한다.
    wall_jet_gain: 1.4
  pulse:
    enabled: false
    period_s: 0.5
    duty: 0.5

body:
  # 몸 모델 (docs/mesh_transition.md). mesh = MakeHuman 사람 메시 (airis/sim/human_mesh.py), capsule = 캡슐 마네킹.
  # capsule → mesh (5단계, E5 기록 후). 캡슐 경로는 build_body(..., model="capsule") 폴백으로 남긴다 (E5 재현·비교용).
  model: mesh

air:
  density: 1.2                    # kg/m^3
  viscosity: 1.8e-5               # Pa·s
  friction_coeff: 0.005           # 벽면 마찰 계수 Cf. tau = 0.5·rho·Cf·|u_t|^2
  wall_offset_m: 0.005            # 공기 속도를 조회하는 표면 위 거리

particles:
  count_per_candidate: 20000
  size_distribution_um:           # 입자 지름 분포 (로그 정규)
    median: 20.0
    sigma_log: 0.6
  density_kg_m3: 2000.0
  drag_model: schiller_naumann

adhesion:                         # rock'n'roll 모델 근사
  # 실효 중앙값 tau_med = critical_shear_pa_median × fabric_roughness_factor (00_common.md 4.3) = 0.225 Pa.
  # 미보정 작업값, E3 민감도 스윕 대상 (jet.impingement.wall_jet_gain 과 함께). 제거율은 이 곱에만 의존한다.
  # 이탈 전단 중앙값 (Ibrahim, Dunn & Brach 2003, J. Aerosol Sci. 34:765). [원문] 확인 (2026-09-30): 측정 입자는 30~77 µm
  # 이고 20 µm 측정은 없다. 이탈 문턱 속도(그림 11)를 식 1 u* = 0.0375U + 0.0387 로 전단에 옮기면 32 µm 유리 입자
  # (GL32, 나노 규모로 거친 유리면, 부착력 비 C ≈ 0.01) 약 0.55 Pa, 70 µm 는 0.04~0.07 Pa. 0.5 Pa 는 "20 µm 매끈한 표면"이
  # 아니라 "약 30 µm, 약간 거친 유리면" 값에 가깝다 (20 µm 는 모델 곡선 외삽 약 0.75 Pa). 옷감 값은 문헌에 없다.
  critical_shear_pa_median: 0.5
  critical_shear_sigma_log: 0.8
  # 거친 표면에서 이탈 전단이 낮아지는 비율 (같은 논문: 표면 거칠기가 부착력을 줄여 문턱을 낮춘다). 옷감 값으로
  # 보정되지 않은 맞춤값이다.
  # 1.0 → 0.1 (PR #10) → 0.25 (B 단계 8, k 1, 캡슐 몸 기준 자세 R ≈ 7.9%) → 0.45 (k 1.0 → 1.4).
  # k 를 올려도 기준 자세 PoseParams() 전신 R 이 그대로이도록 다시 맞췄다: 메시 몸·퓨리움 부스·PatchEvaluator
  # 1,500/m² 에서 k 1.0·f 0.25 → R 8.13%, k 1.4 에서 같은 R 은 f 0.444 → 반올림 0.45 (R 8.01%, 목표 5~10%).
  # k 1.4·f 0.25 그대로면 R 14.1%. 보정 없이(법선을 넘기지 않는 평가기) 쓰면 기준 자세 R 은 더 낮다.
  fabric_roughness_factor: 0.45
  redeposition_prob: 0.05
  kinetics:
    # 시간 의존 제거 R(t) = R∞·(1 − exp(−t/T_r)) (00_common.md 4.6). 계획 평가 evaluate_plan 에만 적용하고
    # 단일 자세 evaluate 는 시간 항이 없는 점근값(4.3)을 유지한다. 확장 실험(E7)에서 true 로 켠다.
    enabled: false
    time_constant_s: 2.0          # T_r. 미보정 작업값 (docs/plan_extension.md 4절 추정), E3 스윕 0.5·1·2·5
    # T_r 문헌 확인 (2026-09-30). [원문] = PDF 원문 직접 확인.
    #   - [원문] rock'n'roll 모델 (Zhang, Reeks et al. arXiv 1206.1939 2·12쪽, arXiv 1204.6113 16·19쪽): 단기 재비산은
    #     제거력 요동 시간 규모(ω⁻¹, u* 0.3~1 m/s 에서 0.1~1 ms)에서 ωt ≈ 10 까지 끝나고, 이후 재비산율은 t^−1.06 으로
    #     준다 (단일 지수가 아니다). 1204.6113 22쪽은 노출 1 s 를 이미 장기 구간인 "nominal time" 으로 쓴다.
    #   - [원문] Ibrahim 2003 9쪽: 입자의 약 90% 가 유동 가속 구간에서 떨어졌고 가속 구간 제거율이 정상 구간의 약 600배
    #     → 실제 시간 규모는 입자 고유값이 아니라 유동이 켜지는 속도(팬 가동)가 정한다.
    #   - 에어샤워 실측: 효율 35~90%, 30 s 가 최적이고 그 이상은 이득이 작다, 의복 제거율 56~62%
    #     (Loughran & Shea 1996, Solid State Technology, 기사 HTML). 몸 회전·배기 시간이 섞인 값이다.
    #   - "Keedy 2008" 은 찾지 못했다. Fletcher 2008·Keedy 2012·Kim 2009 (AST) 원문은 출판사 접근 확인 페이지에 막혀
    #     보지 못했다.
    #   해석: 물리 상수로서 T_r 은 1 s 보다 훨씬 짧다. 2.0 s 작업값은 "팬 가동·자세 안정 시간을 합친 장치 시간 상수"로
    #   읽어야 한다. 이때 5~20 s 에서 R 은 R∞ 의 92% 이상이라 시간 이득은 거의 에너지 벌점과의 교환으로만 남는다.
    #   실제 장기 꼬리(t^−1 율 → R 이 ln t 로 증가)가 시간 최적화에 중요하면 로그형 대안
    #   R = R∞·[a + (1−a)·ln(1+t/t₀)/ln(1+T_ref/t₀)] 을 민감도에 추가하는 것을 권한다. 스윕 0.5·1·2·5 유지.

simulation:
  duration_s: 3.0
  dt_s: 0.002
  seed: 0
  dump_every: 0                   # 프레임 덤프 간격 (스텝). 0 = 끔

scoring:
  part_weights:
    torso_front: 1.0
    torso_back: 1.0
    arms: 1.0
    legs: 0.8
    head: 0.5
  discomfort_weight: 0.1
  # --- 계획 점수 (00_common.md 4.4 score_plan). 단일 자세 점수에는 쓰지 않는다. 전부 미보정 작업값, E3 스윕 대상.
  energy_weight: 0.1              # w_E. 에너지 e (4.7) 가중. 스윕 0·0.05·0.1·0.2·0.4
  time_weight: 0.0                # w_T. 대기 시간 T/T_ref 가중. 처리량을 반영할 때만 켠다
  reference_duration_s: 20.0      # T_ref. 제품 기본 동작 시간 (현행 운전 e = 1 의 기준)

fan:
  # 구역 세기·풍량·에너지 (00_common.md 4.7). 세기 s 는 jet.slot.exit_velocity_mps 배수 (노즐 m 의 s_m =
  # 구역 세기 × nozzles.yaml strength). 전부 미보정 작업값, E3 스윕 대상. 팬별 속도 제어·정격 초과 운전 가능
  # 여부는 퓨리움 확인 대기 (개별 제어가 안 되면 구역을 전체 1개로 줄인다, docs/plan_extension.md 9절).
  rated_flow_m3_min: 9.2          # 팬 1개 정격 풍량 (퓨리움 사양 "크로스팬 단품 9.2 m^3/min × 12개"). Q_m = s_m × 이 값
  s_max: 1.0                      # 구역 세기 상한. 현 장비 1.0, 재배분 실험 1.5
  cap_ratio: 1.0                  # 총 풍량 한도 Σ_m s_m ≤ cap_ratio × M. 추가 실험 0.7
  power_exponent: 3               # 에너지 e ∝ Σ s_m^p (팬 상사 법칙 p = 3). 스윕 2·3

plan:
  # 계획(자세 순서 + 시간 + 구역 세기) 범위 (docs/plan_extension.md 2·4절, C 의 PlanLimits 가 읽는다). 미보정 작업값.
  n_phases: 2                     # 단계 수 K. 21차원. 3단계는 후속
  duration_bounds_s: [5.0, 20.0]  # 총 시간 T 범위 (제품 설명서의 체류 시간)
  min_phase_s: 2.0                # 단계 최소 시간 (추정)
  transition_s: 1.5               # 단계 사이 자세 전환 시간. 이 동안 제거 0 (추정)
