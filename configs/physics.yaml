# 물리 상수 단일 소스. 소유자: B (물리 모델). 변경은 PR로만.
# 민감도 실험은 이 파일의 값을 기준으로 스윕한다.

jet:
  # 0.004 → 0.025 (B, PR #6). 4 mm 는 노즐 16개 총 유량이 18 m^3/h 로 에어샤워 규모와 두 자릿수 이상 어긋나고,
  # 몸 표면 전단이 모든 자세에서 제거율 0 을 만들었다. 25 mm 면 707 m^3/h. 에어샤워 볼 노즐 20~30 mm.
  nozzle_diameter_m: 0.025
  exit_velocity_mps: 25.0         # 에어샤워 표준 풍속
  # 포텐셜 코어 길이 L_c = decay_constant × nozzle_diameter_m (00_common.md 4.1). 별도 키를 두지 않는다.
  decay_constant: 6.7             # 중심 속도 감쇠 상수 (자유 제트 실험식)
  halfwidth_spread_rate: 0.096    # 반속도 반경 확산율 r_1/2 = 0.5D + 0.096 s (원형 난류 제트 실험값)
  impingement:
    # 충돌 제트 보정은 B 단계 8 (2주차 옵션). 아직 구현되지 않았으므로 false 로 둔다.
    # 구현되면 true 로 되돌린다. true 인 채로 surface_normals 를 넘기면 jet.py 가 막는다.
    enabled: false
    stagnation_radius_factor: 2.0 # 정체 영역 반경 (제트 반지름 배수)
    wall_jet_start_factor: 2.9    # 벽면 제트 영역 시작
  pulse:
    enabled: false
    period_s: 0.5
    duty: 0.5

air:
  density: 1.2                    # kg/m^3
  viscosity: 1.8e-5               # Pa·s
  friction_coeff: 0.005           # 벽면 마찰 계수 Cf. tau = 0.5·rho·Cf·|u_t|^2
  wall_offset_m: 0.005            # 공기 속도를 조회하는 표면 위 거리

particles:
  count_per_candidate: 20000
  size_distribution_um:           # 입자 지름 분포 (로그 정규)
    median: 20.0
    sigma_log: 0.6
  density_kg_m3: 2000.0
  drag_model: schiller_naumann

adhesion:                         # rock'n'roll 모델 근사
  # 실효 중앙값 tau_med = critical_shear_pa_median × fabric_roughness_factor (00_common.md 4.3) = 0.05 Pa.
  # 미보정 작업값, E3 민감도 스윕 대상. 제거율은 이 곱에만 의존한다.
  critical_shear_pa_median: 0.5   # 매끈한 표면, 20 µm 입자 이탈 전단 (Ibrahim, Dunn & Brach 2003, J. Aerosol Sci. 34:765)
  critical_shear_sigma_log: 0.8
  # 1.0 → 0.1 (B, PR #10, 총괄 결정). 거친 표면에서 이탈 전단이 낮아지는 비율 (같은 논문의 거친 표면 결과 근거).
  # 옷감 값으로 보정되지 않았다. 고정 노즐 배치에서 몸 표면 전단은 p99 약 0.1 Pa 라 실효 0.5 Pa 이면
  # 제거율이 모든 자세에서 0 에 붙는다. Cf(friction_coeff)는 교과서값 그대로 둔다.
  fabric_roughness_factor: 0.1
  redeposition_prob: 0.05

simulation:
  duration_s: 3.0
  dt_s: 0.002
  seed: 0
  dump_every: 0                   # 프레임 덤프 간격 (스텝). 0 = 끔

scoring:
  part_weights:
    torso_front: 1.0
    torso_back: 1.0
    arms: 1.0
    legs: 0.8
    head: 0.5
  discomfort_weight: 0.1
